<!DOCTYPE html>
<html>
<head>
    <title>Project GLIDE - Mission Planning Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: #f4f7f6; }
        
        #sidebar { 
            width: 340px; 
            background: #ffffff; 
            color: #2c3e50; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 1000;
        }

        #branding {
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
            margin-bottom: 5px;
        }

        #title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2b769c;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        #map { flex-grow: 1; }
        
        h3 { margin-top: 0; font-size: 1.05rem; color: #2b769c; }
        
        button { 
            background: #2b769c;
            color: white; 
            border: none; 
            padding: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover { background: #1f5a78; }
        
        .process-button { 
            background: #69b552;
            font-size: 1.1rem; 
            padding: 15px; 
            margin-top: auto; 
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(105, 181, 82, 0.3);
            text-transform: uppercase;
        }
        .process-button:hover { background: #559942; }
        
        .search-container { position: relative; }
        input[type="text"], input[type="number"] { 
            padding: 8px; 
            width: calc(100% - 18px); 
            border-radius: 4px; 
            border: 1px solid #bdc3c7; 
            background: #f8f9fa; 
            color: #2c3e50; 
            font-size: 0.95rem;
        }
        input[type="text"]:focus, input[type="number"]:focus { outline: none; border-color: #2b769c; }
        
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            width: 100%;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
            z-index: 2000;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #ecf0f1;
            top: 40px;
        }
        .dropdown-content div {
            color: #2c3e50;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid #f1f1f1;
            line-height: 1.3;
        }
        .dropdown-content div:hover { background-color: #eaf2f8; }

        .info-box { 
            background: #eaf2f8; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 0.9rem; 
            line-height: 1.4;
        }
        label { font-size: 0.9rem; font-weight: bold; color: #7f8c8d; }
		
		.param-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .param-col {
            flex: 1;
        }
        .param-col label { font-size: 0.8rem; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .checkbox-row input { width: 18px; height: 18px; cursor: pointer; }
        
    </style>
</head>
<body>

<div id="sidebar">
    <div id="branding">
        <img src="ProjectGlideLogo.png" alt="Project GLIDE Logo" width="180" height="auto"><br>
        <p id="title">Mission Planning Tool</p>
    </div>
    
    <div class="search-container">
        <label>Search Location:</label><br>
        <input type="text" id="searchInput" placeholder="Southampton" oninput="rateLimitedSearch()" autocomplete="off" style="margin-top: 5px;" />
        <div id="searchDropdown" class="dropdown-content"></div>
    </div>

    <div class="info-box">
        <h3>1. Set Grid Origin</h3>
        <button onclick="OriginPicker()" style="margin-top: 5px; width: 100%;">Place Origin Marker</button>
        <p id="originText" style="color: #e67e22; margin-top: 10px; margin-bottom: 0; font-family: monospace; font-weight:bold;">Origin: Not Set</p>
    </div>

    <div class="info-box">
        <h3>2. Draw Priority Zones</h3>
        Use the map tools to draw the desired areas.<br><br>
        Assign a priority score (0 - 15).<br><br>
    </div>
	
	<div class="info-box">
        <h3>3. Altitude Constraints</h3>
        <div class="param-row">
            <div class="param-col">
                <label>Floor (m)</label>
                <input type="number" id="floorAlt" value="50" min="0">
            </div>
            <div class="param-col">
                <label>Ceiling (m)</label>
                <input type="number" id="ceilingAlt" value="120" min="0">
            </div>
        </div>
    </div>
	
	<div class="info-box">
        <h3>4. Mission Parameters</h3>
        <div class="param-row">
            <div class="param-col">
                <label>Time (mins)</label>
                <input type="number" id="missionTime" value="20" min="1">
            </div>
            <div class="param-col">
                <label>Battery (mAh)</label>
                <input type="number" id="startBattery" value="2200" min="100">
            </div>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="reserveRth" checked>
            <label style="color:#2c3e50; font-weight:normal; cursor:pointer;" for="reserveRth">Factor in Reserve RTH</label>
        </div>
    </div>

    <button class="process-button" onclick="processMap()">Download .bin</button>
</div>

<div id="map"></div>

<script>
	// MAP LAYERS
    const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
    });

    const cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
    });

    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        maxZoom: 19
    });

    // MAP INIT
	mapLat = 50.9350;
	mapLon = -1.3940; // defaut to Soton
    const map = L.map('map', {
        zoomControl: false,
        layers: [cartoLight] 
    }).setView([mapLat, mapLon], 13); 
    
    L.control.zoom({position: 'topright'}).addTo(map);

    const baseMaps = {
        "Light Mode": cartoLight,
        "Dark Mode": cartoDark,
        "Satellite View": esriSatellite
    };
    
    L.control.layers(baseMaps, null, {position: 'topright'}).addTo(map);


    // DRAWING TOOL
    const drawnItems = new L.FeatureGroup().addTo(map);
    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: {
            polygon: false, polyline: false, marker: false, circlemarker: false, circle: false,
            rectangle: { shapeOptions: { color: '#2b769c', fillOpacity: 0.3, weight: 2 } },
        }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (event) {
        const layer = event.layer;
        
        let scorePrompt = prompt("Enter Mission Priority Score for this zone (0 - 15).", "8");
        if (scorePrompt === null) return; 

        let score = parseInt(scorePrompt);
        if (isNaN(score) || score < 0 || score > 15) {
            alert("Invalid score. Please enter a whole number between 0 and 15.");
            score = 8;
        }
        
        layer.options.priorityScore = score;
        layer.bindTooltip("Priority: " + score, {permanent: true, direction: "center", className: "priority-label"}).openTooltip();
        drawnItems.addLayer(layer);
    });

	// PRIO ZONE LABELS
    const style = document.createElement('style');
    style.type = 'text/css';
    style.innerHTML = '.priority-label { background: rgba(255,255,255,0.8); border: 1px solid #2b769c; color: #2c3e50; font-weight: bold; font-size: 14px; border-radius: 4px; padding: 2px 6px;}';
    document.getElementsByTagName('head')[0].appendChild(style);


    //  SEARCH BOX
    let searchTimeout = null;
    const searchInput = document.getElementById('searchInput');
    const searchDropdown = document.getElementById('searchDropdown');

    function rateLimitedSearch() {
        clearTimeout(searchTimeout);
        const query = searchInput.value.trim();
        
        if (query.length < 2) {
            searchDropdown.style.display = 'none';
            return;
        }

        // 300ms rate limit
        searchTimeout = setTimeout(() => {
            fetchLocations(query);
        }, 300);
    }

    async function fetchLocations(query) {
	try {
            // using Photon API
			const center = map.getCenter();
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5&lat=${center.lat}&lon=${center.lng}`);
            const data = await res.json();
            
            searchDropdown.innerHTML = '';
            
            if (data.features && data.features.length > 0) {
                data.features.forEach(feature => {
                    const props = feature.properties;
                    const nameParts = [props.name, props.city, props.state, props.country].filter(Boolean);
                    
                    const uniqueNameParts = [...new Set(nameParts)];
                    const displayName = uniqueNameParts.join(', ');
                    
                    const lon = feature.geometry.coordinates[0];
                    const lat = feature.geometry.coordinates[1];
                    
                    const item = document.createElement('div');
                    item.innerText = displayName;
                    item.onclick = () => selectLocation(lat, lon, props.name || displayName);
                    searchDropdown.appendChild(item);
                });
                searchDropdown.style.display = 'block';
            } else {
                searchDropdown.style.display = 'none';
            }
        } catch (error) {
            console.error("Photon Search error:", error);
        }
    }

    function selectLocation(lat, lon, name) {
        map.setView([lat, lon], 14);
        searchInput.value = name;
        searchDropdown.style.display = 'none';
    }

    document.addEventListener('click', function(event) {
        if (!searchInput.contains(event.target) && !searchDropdown.contains(event.target)) {
            searchDropdown.style.display = 'none';
        }
    });


    // GRID ORIGIN
    let originMarker = null;
    let gridOverlay = null;
    let selectingOrigin = false;

    function OriginPicker() {
        selectingOrigin = true;
        map.getContainer().style.cursor = 'crosshair';
    }

    map.on('click', function(e) {
        if (!selectingOrigin) return;
        selectingOrigin = false;
        map.getContainer().style.cursor = '';

        if (originMarker) map.removeLayer(originMarker);
        
        originMarker = L.circleMarker(e.latlng, {color: '#e67e22', radius: 8, fillOpacity: 1, weight: 3}).addTo(map);
        originMarker.bindTooltip("Origin", {permanent: true, direction: "left", className: "priority-label"}).openTooltip();
        
        document.getElementById('originText').innerText = `SW Corner: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
        drawGridOverlay();
    });


    // GRID OVERLAY
    function drawGridOverlay() {
        if (!originMarker) return;
        if (gridOverlay) map.removeLayer(gridOverlay);

        const lat = originMarker.getLatLng().lat;
        const lng = originMarker.getLatLng().lng;

        const latOffset = 5000 / 111111;
        const lngOffset = 5000 / (111111 * Math.cos(lat * Math.PI / 180));

        const bounds = [[lat, lng], [lat + latOffset, lng + lngOffset]];
        gridOverlay = L.rectangle(bounds, {color: "#2b769c", weight: 2, fillOpacity: 0.0, dashArray: '5, 5'}).addTo(map);
    }



    // PROCESS BINARY (4-Bit packing)
    function processMap() {
        if (!originMarker) {
            alert("Set the Grid Origin first");
            return;
        }
		
		let rawName = prompt("Enter a name for this mission:", "GLIDE_Mission_1"); // sanitise file name
		if (rawName === null) return;
		let safeName = rawName.trim().replace(/[^a-zA-Z0-9-_]/g, '_');
		if (safeName.length === 0) {
            safeName = "GLIDE_Mission_1";
        }
		
		const headerSize = 20; // binary file header size
		
		const floorAlt = parseFloat(document.getElementById('floorAlt').value) || 0;
        const ceilingAlt = parseFloat(document.getElementById('ceilingAlt').value) || 0;
        
        const missionTimeSeconds = (parseInt(document.getElementById('missionTime').value) || 0) * 60; // minutes to seconds
        const startBattery = parseFloat(document.getElementById('startBattery').value) || 0;
        const reserveRth = document.getElementById('reserveRth').checked ? 1 : 0;

        const width = 500;
        const height = 500;
        const resolution_m = 10; 
        
        const totalCells = width * height;
        const payloadSize = totalCells / 2; 
        
        const buffer = new ArrayBuffer(headerSize + payloadSize);
        const view = new DataView(buffer);
        
        view.setUint32(0, 0x47503533, true); // 'GP53' - GDP doesn't fit :(
        
        const originLat = originMarker.getLatLng().lat;
        const originLng = originMarker.getLatLng().lng;

        view.setInt32(4, Math.round(originLat * 1e7), true);
        view.setInt32(8, Math.round(originLng * 1e7), true);
        view.setUint16(12, width, true);
        view.setUint16(14, height, true);
        view.setFloat32(16, resolution_m, true);
		
		view.setFloat32(20, floorAlt, true);
        view.setFloat32(24, ceilingAlt, true);
        view.setFloat32(28, startBattery, true);
        view.setUint16(32, missionTimeSeconds, true); // seconds
        view.setUint8(34, reserveRth); // boolean 1 or 0
		// Byte 35 is left implicitly as 0

        const packedData = new Uint8Array(buffer, headerSize);

        const mPerLat = 111111; // metres per unit latitude - projection a concern?
        const mPerLng = 111111 * Math.cos(originLat * Math.PI / 180);

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                
                const cellLat = originLat + ((y * resolution_m) / mPerLat);
                const cellLng = originLng + ((x * resolution_m) / mPerLng);
                const cellLatLng = L.latLng(cellLat, cellLng);

                let totalCellScore = 0;

                drawnItems.eachLayer(function(layer) {
                    let inside = false;
                    if (layer instanceof L.Circle) {
                        if (map.distance(cellLatLng, layer.getLatLng()) <= layer.getRadius()) inside = true;
                    } else if (layer instanceof L.Rectangle) {
                        if (layer.getBounds().contains(cellLatLng)) inside = true;
                    }

                    if (inside) totalCellScore += layer.options.priorityScore;
                });

                if (totalCellScore > 15) totalCellScore = 15;  // clip to max 15

                const cellIndex = y * width + x;
                const byteIndex = Math.floor(cellIndex / 2);
                
                if (cellIndex % 2 === 0) {
                    packedData[byteIndex] |= (totalCellScore << 4);
                } else {
                    packedData[byteIndex] |= (totalCellScore & 0x0F);
                }
            }
        }

        const blob = new Blob([buffer], { type: "application/octet-stream" });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = safeName + ".bin";
        link.click();
        
        alert(
            `Processing Complete!\n\n` +
            `Your mission data has been downloaded as: ` +
            `'${safeName}.bin'\n\n` +
            `IMPORTANT UPLOAD INSTRUCTIONS \n` +
            `Before flying, you MUST:\n` +
            `1. Rename this file to exactly: 'glide.bin'\n` +
            `2. Place it inside the APM folder on the AP SD card.`
        );
    }
</script>
</body>
</html>
